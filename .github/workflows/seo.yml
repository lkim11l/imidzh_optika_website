name: SEO checks
on: [push, pull_request]
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The test suite includes a full isolated build with local fixtures.
      # CI never needs production database credentials.
      - run: npm run test:seo
