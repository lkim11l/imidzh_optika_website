<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление — Имидж Оптика</title><link rel="stylesheet" href="/assets/admin.css"></head><body>
<header><a href="/">Имидж Оптика</a><span>Управление сайтом</span><button id="logout" hidden>Выйти</button></header>
<main><div id="message" role="status" aria-live="polite"></div><section id="login-panel" class="login panel"><p class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</p><h1>Рады видеть вас.</h1><p>Войдите, чтобы управлять каталогом и заявками.</p><form id="login"><label>Электронная почта<input name="email" type="email" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button></form><p class="hint">Доступ предоставляется владельцем проекта. После обновления страницы потребуется повторный вход.</p></section>
<section id="workspace" hidden><nav class="tabs" aria-label="Разделы управления"><button data-tab="products" aria-pressed="true">Товары</button><button data-tab="bookings" aria-pressed="false">Заявки</button><button data-tab="content" aria-pressed="false">Главная страница</button></nav><div id="workspace-body"></div></section>
</main><dialog id="editor"><form id="product-form"><div class="heading"><h2 id="editor-title">Товар</h2><button type="button" id="close-editor" aria-label="Закрыть">×</button></div><div class="fields">
<label>Бренд<input name="brand" required maxlength="100"></label><label>Модель<input name="model" required maxlength="150"></label><label class="wide">Адрес модели<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="160"><small>Латинские буквы, цифры и дефисы</small></label>
<label>Категория<select name="category"><option value="optical">Оправы</option><option value="sunglasses">Солнцезащитные</option></select></label><label>Для кого<select name="gender"><option value="unisex">Унисекс</option><option value="women">Женские</option><option value="men">Мужские</option></select></label>
<label>Цена, ₽<input name="price" type="number" required min="0" max="10000000" step="1"></label><label>Старая цена, ₽<input name="oldPrice" type="number" min="0" max="10000000" step="1"></label>
<label class="wide">Краткое описание<textarea name="shortDescription" maxlength="500"></textarea></label><label class="wide">Описание<textarea name="description" maxlength="3000"></textarea></label>
<label>Форма<input name="shape" maxlength="100"></label><label>Цвет<input name="color" maxlength="100"></label><label>Материал<input name="material" maxlength="100"></label><label>Порядок в каталоге<input name="popularity" type="number" min="0" max="1000" step="1" value="0"></label>
<label class="wide">Фотографии — один адрес на строку<textarea name="images" required rows="3"></textarea><small>До 12 изображений: HTTPS или /assets/…</small></label><label class="wide">Добавить фотографию<input id="upload" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG или WebP, до 5 МБ. Файл станет общедоступным изображением товара.</small></label>
<label class="check"><input name="published" type="checkbox">Показывать в каталоге</label><label class="check"><input name="isFeatured" type="checkbox">На главной странице</label><label class="check"><input name="isNew" type="checkbox">Новинка</label><label class="check"><input name="isMock" type="checkbox">Демонстрационная модель</label></div><p id="editor-message" role="status"></p><div class="actions"><button class="primary" id="save-product">Сохранить товар</button><button type="button" id="cancel-editor">Отмена</button></div></form></dialog>
<script type="module" src="/assets/admin.js"></script></body></html>
